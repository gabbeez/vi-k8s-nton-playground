name: Execute Ansible via GitHub Cloud
on:
  push:
    branches:
      - main

jobs:
  ansible-deployment-drill:
    runs-on: ubuntu-latest
    steps:
      - name: Pull our repository code onto the runner
        uses: actions/checkout@v4

      - name: Set up Python on the runner
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible toolset via Pip
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Execute the Ansible Playbook
        run: ansible-playbook -i hosts.ini setup-infrastructure.yaml

